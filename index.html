<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de Carros</title>
<style>
body{
    margin:0;
    background:#4CAF50;
    overflow:hidden;
}
#pista{
    position:relative;
    width:100vw;
    height:100vh;
    background:#666;
}
.linea{
    position:absolute;
    width:100%;
    height:5px;
    background:white;
}
.carro{
    position:absolute;
    width:50px;
    height:30px;
    border-radius:5px;
}
.bala{
    position:absolute;
    width:10px;
    height:4px;
    background:yellow;
}
</style>
</head>
<body>

<div id="pista">
<div class="linea" style="top:25%"></div>
<div class="linea" style="top:50%"></div>
<div class="linea" style="top:75%"></div>

<div class="carro" id="c1" style="background:red;left:50px;top:100px;"></div>
<div class="carro" id="c2" style="background:blue;left:150px;top:200px;"></div>
<div class="carro" id="c3" style="background:green;left:250px;top:300px;"></div>
<div class="carro" id="c4" style="background:orange;left:350px;top:400px;"></div>
<div class="carro" id="c5" style="background:purple;left:450px;top:500px;"></div>

</div>

<script>
const carro=document.getElementById("c1");

document.addEventListener("keydown",e=>{
let x=carro.offsetLeft;
let y=carro.offsetTop;

if(e.key=="ArrowUp") carro.style.top=(y-10)+"px";
if(e.key=="ArrowDown") carro.style.top=(y+10)+"px";
if(e.key=="ArrowLeft") carro.style.left=(x-10)+"px";
if(e.key=="ArrowRight") carro.style.left=(x+10)+"px";

if(e.code=="Space"){
    disparar();
}
});

function disparar(){
    const bala=document.createElement("div");
    bala.className="bala";
    bala.style.left=(carro.offsetLeft+50)+"px";
    bala.style.top=(carro.offsetTop+13)+"px";
    document.getElementById("pista").appendChild(bala);

    let mover=setInterval(()=>{
        bala.style.left=(bala.offsetLeft+10)+"px";
        if(bala.offsetLeft>window.innerWidth){
            clearInterval(mover);
            bala.remove();
        }
    },20);
}
</script>

</body>
</html>
